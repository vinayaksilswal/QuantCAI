[pytest]
testpaths = tests
asyncio_mode = strict

# Registering markers turns "PytestUnknownMarkWarning: Unknown pytest.mark.integration
# - is this a typo?" into a real contract. Unregistered marks are silently
# meaningless, so a mistyped one would quietly stop filtering anything.
markers =
    integration: hits the network or a live external service; excluded from the default run

# Integration tests make real outbound TLS connections, so they are opt-in.
# Run them explicitly with:  pytest -m integration
addopts = -m "not integration"

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
