apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantcai.fullname" . }}-backend
  labels:
    {{- include "quantcai.labels" . | nindent 4 }}
    app: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quantcai.selectorLabels" . | nindent 6 }}
      app: backend
  template:
    metadata:
      labels:
        {{- include "quantcai.selectorLabels" . | nindent 8 }}
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantcai.fullname" . }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantcai.fullname" . }}-secrets
                  key: redis-url
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantcai.fullname" . }}-secrets
                  key: jwt-secret
            - name: ENV
              value: "production"
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: SAML_ENABLED
              value: {{ .Values.saml.enabled | quote }}
            - name: SAML_SP_ENTITY_ID
              value: {{ .Values.saml.spEntityId | quote }}
            - name: SAML_SP_ACS_URL
              value: {{ .Values.saml.spAcsUrl | quote }}
            - name: SAML_IDP_SSO_URL
              value: {{ .Values.saml.idpSsoUrl | quote }}
            - name: SAML_IDP_ENTITY_ID
              value: {{ .Values.saml.idpEntityId | quote }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantcai.fullname" . }}-backend
  labels:
    {{- include "quantcai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "quantcai.selectorLabels" . | nindent 4 }}
    app: backend
