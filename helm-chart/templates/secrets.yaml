apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quantcai.fullname" . }}-secrets
  labels:
    {{- include "quantcai.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ .Values.database.url | b64enc | quote }}
  redis-url: {{ .Values.redis.url | b64enc | quote }}
  jwt-secret: {{ .Values.security.jwtSecret | b64enc | quote }}
