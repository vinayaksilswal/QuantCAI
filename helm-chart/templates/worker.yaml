apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantcai.fullname" . }}-worker
  labels:
    {{- include "quantcai.labels" . | nindent 4 }}
    app: worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quantcai.selectorLabels" . | nindent 6 }}
      app: worker
  template:
    metadata:
      labels:
        {{- include "quantcai.selectorLabels" . | nindent 8 }}
        app: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["celery", "-A", "worker.celery", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantcai.fullname" . }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantcai.fullname" . }}-secrets
                  key: redis-url
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantcai.fullname" . }}-secrets
                  key: jwt-secret
            - name: ENV
              value: "production"
